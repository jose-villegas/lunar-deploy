<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
  <title>Lunar Deploy</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    /* Mobile: dragging steers the ship, so no page scroll, pinch zoom, long-press selection or callout. */
    html, body, #unity-canvas {
      touch-action: none;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    /* 9:16 portrait at the largest size the window allows. */
    #unity-canvas {
      width: min(100vw, calc(100vh * 9 / 16));
      height: min(100vh, calc(100vw * 16 / 9));
      background: #0a0f24;
      outline: none;
    }
    #loading { position: fixed; left: 50%; bottom: 12%; width: 40vmin; height: 4px; transform: translateX(-50%); background: #1b2340; }
    #loading-bar { width: 0; height: 100%; background: #5ac8ff; transition: width 0.1s; }
  </style>
</head>
<body>
  <div id="stage"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
  <div id="loading"><div id="loading-bar"></div></div>
  <script src="builds/20260926100628/Build/WebGL.loader.js"></script>
  <script>
    const canvas = document.querySelector("#unity-canvas");
    const loading = document.querySelector("#loading");
    const bar = document.querySelector("#loading-bar");
    // iOS Safari ignores user-scalable=no and touch-action for some gestures; block them outright.
    for (const type of ["touchmove", "gesturestart", "dblclick"]) {
      document.addEventListener(type, (event) => event.preventDefault(), { passive: false });
    }
    document.addEventListener("contextmenu", (event) => event.preventDefault());
    createUnityInstance(canvas, {
      dataUrl: "builds/20260926100628/Build/WebGL.data.unityweb",
      frameworkUrl: "builds/20260926100628/Build/WebGL.framework.js.unityweb",
      codeUrl: "builds/20260926100628/Build/WebGL.wasm.unityweb",
      streamingAssetsUrl: "builds/20260926100628/StreamingAssets",
      // Phones report ~3x pixel density: rendering at full density shrinks Bloom's reach and the
      // spark dither to a fraction of the screen (harsh, washed-out glow) and costs ~4x the pixels.
      // Capped, a phone renders close to a laptop, so the neon looks the same on both.
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
      companyName: "DefaultCompany",
      productName: "Lunar Deploy",
      productVersion: "1.0",
    }, (progress) => {
      bar.style.width = `${progress * 100}%`;
    }).then(() => {
      loading.remove();
      canvas.focus();
    }).catch((message) => {
      alert(message);
    });
  </script>
</body>
</html>
